name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Switch Pages source to GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"workflow"}')"
          echo "GitHub Pages API status: ${response}"
          cat /tmp/pages.json
          if [ "${response}" != "200" ] && [ "${response}" != "204" ]; then
            echo "::warning::Could not switch Pages from Jekyll/branch to GitHub Actions. Open Settings → Pages → Source → GitHub Actions."
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p pages-out
          if [ -d dist/client ]; then
            cp -R dist/client/. pages-out/
          elif [ -d dist ]; then
            cp -R dist/. pages-out/
            rm -rf pages-out/server pages-out/entry.mjs pages-out/package.json
          else
            echo "Astro build did not produce dist/ or dist/client/"
            ls -la
            exit 1
          fi
          touch pages-out/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
